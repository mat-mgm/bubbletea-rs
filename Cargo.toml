[package]
name = "bubbletea-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "A Rust port of Bubble Tea (charm.land/bubbletea), a TUI framework based on The Elm Architecture."
license = "MIT"
repository = "local"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "io-util", "io-std"] }
tokio-util = "0.7"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
unicode-width = "0.2"
unicode-segmentation = "1"
anstyle = "1"
base64 = "0.22"
thiserror = "2"
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[example]]
name = "simple"
path = "examples/simple.rs"

[[example]]
name = "altscreen"
path = "examples/altscreen.rs"

[[example]]
name = "spinner"
path = "examples/spinner.rs"

[[example]]
name = "mouse"
path = "examples/mouse.rs"

[[example]]
name = "progress"
path = "examples/progress.rs"

[[example]]
name = "exec"
path = "examples/exec.rs"

[[example]]
name = "send_msg"
path = "examples/send_msg.rs"

[[example]]
name = "print_key"
path = "examples/print_key.rs"
